name: Deploy Fabel Website

on:
  push:
    branches:
      - dev
      - qa
      - uat
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies & build
        run: |
          npm install
          npm run build || npm run export || true

      - name: Set target folder
        id: vars
        run: |
          if [[ "${GITHUB_REF##*/}" == "dev" ]]; then
            echo "target=/var/www/dev" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF##*/}" == "qa" ]]; then
            echo "target=/var/www/qa" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF##*/}" == "uat" ]]; then
            echo "target=/var/www/uat" >> $GITHUB_ENV
          else
            echo "target=/var/www/main" >> $GITHUB_ENV
          fi

      - name: Prepare remote folder
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p ${{ env.target }}
            rm -rf ${{ env.target }}/*

      - name: Copy build files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "dist/*"
          target: ${{ env.target }}
